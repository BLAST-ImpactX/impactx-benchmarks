# Pixi workspace for the impactx-benchmarks suite.
#
# One isolated environment per simulation code, plus a "default" driver
# environment that orchestrates the runs, validates physics, and plots.
#
# The driver shells out to each code environment via `pixi run -e <code> ...`.
# Native build flags (-march=native -mtune=native) are injected per code via
# `[feature.<code>.activation.env]`, which applies both locally and in CI
# (the runner is always the host that executes the benchmark).
#
# Usage:
#   pixi run build          # compile/install the from-source codes
#   pixi run bench          # run the benchmark matrix (append CLI flags after --)
#   pixi run validate       # re-run physics validation on stored results
#   pixi run plot           # (re)generate plots from stored results
#   pixi run metadata       # print host/OS/CPU/compiler + resolved versions
#   pixi run publish        # (opt-in) commit results+plots to the benchmarks branch

[workspace]
name = "impactx-benchmarks"
version = "0.1.0"
description = "Automated correctness & performance benchmarks of beam-dynamics codes."
authors = ["Axel Huebl <axelhuebl@lbl.gov>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Target Perlmutter's system glibc (2.38) so a lock solved on a newer host (e.g. local Ubuntu
# glibc 2.39, or CI) stays valid there and pixi never selects a build needing glibc > 2.38.
# conda-forge sysroot_linux-64 maxes at 2.34 (<= 2.38), so every native build is Perlmutter-safe;
# the runtime libstdc++/libgcc (15.x) and gcc (14.x) are already the latest for best SIMD codegen.
[system-requirements]
libc = { family = "glibc", version = "2.38" }

# --------------------------------------------------------------------------- #
# Default feature = the orchestrator / driver / plotter environment.
# --------------------------------------------------------------------------- #
[dependencies]
python = ">=3.11"
jinja2 = "*"
pyyaml = "*"
numpy = "*"
scipy = "*"
matplotlib-base = "*"
archspec = "*"   # CPU microarchitecture name for metadata (CI runner pool varies)

[tasks]
bench = { cmd = "python -m benchmarks.runner", description = "Run the benchmark matrix" }
validate = { cmd = "python -m benchmarks.validate", description = "Validate physics of stored results" }
plot = { cmd = "python -m benchmarks.plotting", description = "Generate plots from stored results" }
metadata = { cmd = "python -m benchmarks.metadata", description = "Print host/env metadata" }
publish = { cmd = "python -m benchmarks.publish", description = "Publish results to the benchmarks branch" }
build = { cmd = "python -m benchmarks.build", description = "Build/install the from-source codes" }

# --------------------------------------------------------------------------- #
# ImpactX (source build: CMake/Ninja, OpenMP + SIMD + FFT, SP/DP).
# --------------------------------------------------------------------------- #
[feature.impactx]
platforms = ["linux-64"]

[feature.impactx.dependencies]
python = ">=3.11"
pip = "*"
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"
ninja = "*"
fftw = "*"
vir-simd = "*"   # required by ImpactX_SIMD=ON (AMReX explicit SIMD backend)
pkg-config = "*"
numpy = "*"
scipy = "*"      # ImpactX runtime dep (per conda-forge feedstock)
quantiphy = "*"  # ImpactX runtime dep (per conda-forge feedstock)
pandas = "*"     # beam.to_df() for per-particle spin readout (htu_spin)
mpich = "*"            # ImpactX MPI build (ranks); OpenMP+MPI hybrid
mpi4py = "*"
libfabric-devel = "*"  # MPICH -lfabric link
ccache = "*"

[feature.impactx.activation.env]
CXXFLAGS = "-march=native -mtune=native"
CFLAGS = "-march=native -mtune=native"

[feature.impactx.tasks]
# IEEE (BENCH_FASTMATH=0) is the base build; the paired "-fm" task adds the fast-math overlay build.
# The DP-CPU IEEE build (build-impactx) is ALSO the verification baseline (config impactx-cpu-simd-dp).
build-impactx = { cmd = "BENCH_FASTMATH=0 bash codes/impactx/build.sh", description = "Compile ImpactX DP CPU IEEE (baseline)" }
build-impactx-fm = { cmd = "BENCH_FASTMATH=1 bash codes/impactx/build.sh", description = "Compile ImpactX DP CPU fast-math (into impactx-fm)" }
build-impactx-sp = { cmd = "BENCH_FASTMATH=0 IMPACTX_PRECISION=SINGLE bash codes/impactx/build.sh", description = "Compile ImpactX SP CPU IEEE (into impactx-sp)" }
build-impactx-sp-fm = { cmd = "BENCH_FASTMATH=1 IMPACTX_PRECISION=SINGLE bash codes/impactx/build.sh", description = "Compile ImpactX SP CPU fast-math (into impactx-sp-fm)" }
# GPU (CUDA) builds: separate tree+env per precision & fast-math. CUDA_ARCH auto-detects (A100=80).
build-impactx-cuda-dp = { cmd = "BENCH_FASTMATH=0 IMPACTX_DEVICE=cuda IMPACTX_PRECISION=DOUBLE bash codes/impactx/build.sh", description = "Compile ImpactX CUDA DP IEEE (into impactx-cuda-dp)" }
build-impactx-cuda-dp-fm = { cmd = "BENCH_FASTMATH=1 IMPACTX_DEVICE=cuda IMPACTX_PRECISION=DOUBLE bash codes/impactx/build.sh", description = "Compile ImpactX CUDA DP fast-math (into impactx-cuda-dp-fm)" }
build-impactx-cuda-sp = { cmd = "BENCH_FASTMATH=0 IMPACTX_DEVICE=cuda IMPACTX_PRECISION=SINGLE bash codes/impactx/build.sh", description = "Compile ImpactX CUDA SP IEEE (into impactx-cuda-sp)" }
build-impactx-cuda-sp-fm = { cmd = "BENCH_FASTMATH=1 IMPACTX_DEVICE=cuda IMPACTX_PRECISION=SINGLE bash codes/impactx/build.sh", description = "Compile ImpactX CUDA SP fast-math (into impactx-cuda-sp-fm)" }

# --------------------------------------------------------------------------- #
# Shared CUDA toolchain feature (composed into the ImpactX GPU envs).
# NOTE: versions to be pinned/verified during tomorrow's GPU builds.
# --------------------------------------------------------------------------- #
[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.dependencies]
cuda-toolkit = "*"     # nvcc + CUDA libs for the ImpactX CUDA build
cuda-nvtx-dev = "*"    # NVTX dev headers (nvtx3/nvToolsExt.h) -- AMReX_GpuDevice.cpp needs them;
                       # cuda-toolkit ships only the nvtx runtime lib, not the headers
cuda-version = "13.2.*" # exact fit to Perlmutter's default cudatoolkit 13.2 (Aug 2026); a 13.2
                        # toolkit build is guaranteed to run on its 13.2 driver (not 13.3, which
                        # could need a newer driver). Local driver 610 also runs 13.2.

# NOTE: CUDA_ARCH is intentionally NOT pinned here -- codes/impactx/build.sh auto-detects the
# GPU's compute capability (local A2000=86, Perlmutter A100=80) so the same env is portable.
# Override with an explicit `CUDA_ARCH=<n>` env at build time if needed.

# --------------------------------------------------------------------------- #
# Cheetah (pip; PyTorch CPU; torch.compile/Inductor).
# --------------------------------------------------------------------------- #
[feature.cheetah.dependencies]
python = ">=3.11"
numpy = "*"
scipy = "*"
pytorch = { version = "*", channel = "conda-forge" }   # CPU build from conda-forge

[feature.cheetah.pypi-dependencies]
cheetah-accelerator = "==0.8.2"

[feature.cheetah.activation.env]
# Persistent Inductor cache so torch.compile artifacts survive across the auto-tune layout
# subprocesses AND across runs/sessions (default is volatile /tmp/torchinductor_*). fx_graph_cache
# is on by default in torch 2.12; this just makes it durable + repo-local. Compile-only; the
# timed track reuses the in-process kernel either way, so measured numbers are unaffected.
TORCHINDUCTOR_CACHE_DIR = "$PIXI_PROJECT_ROOT/.builds/cache/torchinductor"
TORCHINDUCTOR_FX_GRAPH_CACHE = "1"

# --------------------------------------------------------------------------- #
# pyAT (source build for -march=native + OpenMP; DP only).
# --------------------------------------------------------------------------- #
[feature.pyat.dependencies]
python = ">=3.11"
pip = "*"
c-compiler = "*"
numpy = "*"
scipy = "*"
h5py = "*"

[feature.pyat.activation.env]
CFLAGS = "-O3 -march=native -mtune=native"
OPENMP = "1"          # accelerator-toolbox setup.py reads this to enable OpenMP

[feature.pyat.tasks]
build-pyat = { cmd = "BENCH_FASTMATH=0 bash codes/pyat/build.sh", description = "Build pyAT IEEE (OpenMP+native)" }
build-pyat-fm = { cmd = "BENCH_FASTMATH=1 bash codes/pyat/build.sh", description = "Build pyAT fast-math (into pyat-fm)" }

# --------------------------------------------------------------------------- #
# PyORBIT3 (source build: Meson/C++/FFTW, MPI; DP only).
# --------------------------------------------------------------------------- #
[feature.pyorbit.dependencies]
python = ">=3.11"
pip = "*"
c-compiler = "*"
cxx-compiler = "*"
meson = "*"
meson-python = "*"
ninja = "*"
fftw = "*"
pkg-config = "*"
mpich = "*"
mpi4py = "*"
libfabric-devel = "*"  # provides libfabric.so dev symlink for MPICH's -lfabric link
numpy = "*"
scipy = "*"           # htu_lattice.py uses scipy.constants
git = "*"             # meson.build derives the version via setuptools_scm + git
setuptools_scm = "*"
patchelf = "*"        # meson-python uses it for RPATH fixup of the built extensions

[feature.pyorbit.activation.env]
CXXFLAGS = "-march=native -mtune=native"
CFLAGS = "-march=native -mtune=native"

[feature.pyorbit.tasks]
build-pyorbit = { cmd = "BENCH_FASTMATH=0 bash codes/pyorbit/build.sh", description = "Compile PyORBIT3 IEEE" }
build-pyorbit-fm = { cmd = "BENCH_FASTMATH=1 bash codes/pyorbit/build.sh", description = "Compile PyORBIT3 fast-math (into pyorbit-fm)" }

# --------------------------------------------------------------------------- #
# Xsuite (pip; cffi JIT kernels w/ native flags via CFLAGS; OpenMP context).
# --------------------------------------------------------------------------- #
[feature.xsuite.dependencies]
python = ">=3.11"
pip = "*"
setuptools = "*"      # cffi runtime kernel compilation needs it on Python >= 3.12
c-compiler = "*"      # for on-the-fly cffi kernel compilation
numpy = "*"
scipy = "*"

[feature.xsuite.activation.env]
# cffi/distutils append CFLAGS when compiling Xsuite's runtime kernels. Fast-math is NOT baked here:
# it's a per-config RUNTIME toggle -- make_context() injects -ffast-math into the kernel compile when
# BENCH_FASTMATH=1 (the kernel-cache salt includes it, so IEEE/fast-math cache separately). -march=native
# is correct on Perlmutter too (the cffi JIT compiles on the compute node = znver3).
CFLAGS = "-O3 -march=native -mtune=native"
# Fixed hash seed so the generated kernel source (hence our persistent kernel-cache key) is
# deterministic across processes; pairs with scenarios/_xsuite_kernel_cache.py. Affects only
# dict/set iteration order, never the physics (numpy RNG is separately seeded).
PYTHONHASHSEED = "0"
# persistent compiled-kernel cache (repo-local, gitignored); reused across auto-tune layouts + runs
XSUITE_KERNEL_CACHE = "$PIXI_PROJECT_ROOT/.builds/cache/xsuite_kernels"

[feature.xsuite.pypi-dependencies]
xsuite = "==0.53.4"

# --------------------------------------------------------------------------- #
# SciBmad.jl (Julia registry package; native LLVM codegen; SP/DP).
# --------------------------------------------------------------------------- #
[feature.scibmad.dependencies]
julia = ">=1.11"      # >=1.11 avoids the conda-forge Pkg.add SSL/CA bug

[feature.scibmad.activation.env]
JULIA_SSL_CA_ROOTS_PATH = ""    # belt-and-suspenders for the SSL/CA issue

[feature.scibmad.tasks]
build-scibmad = { cmd = "julia --project=codes/scibmad codes/scibmad/build.jl", description = "Instantiate the SciBmad Julia project" }

# --------------------------------------------------------------------------- #
# GPU (CUDA) envs for the pip/Julia codes (run on 1 GPU; DP/SP at runtime).
# NOTE: CUDA package builds/versions to be verified during tomorrow's GPU builds.
# --------------------------------------------------------------------------- #
[feature.cheetah-gpu]
platforms = ["linux-64"]

# Tell the solver the target has a CUDA driver, so conda-forge picks the CUDA pytorch build
# (the `cuda*_mkl_*` variants depend on the __cuda virtual package) instead of the cpu_mkl one.
# pixi does NOT probe the driver by default. "13" = needs CUDA >=13 driver (host driver 610 >> that,
# Perlmutter's 13.2 driver satisfies it), so the solver picks the cuda13* pytorch build.
[feature.cheetah-gpu.system-requirements]
cuda = "13"

[feature.cheetah-gpu.dependencies]
# conda-forge ships CUDA pytorch only for py3.12/3.13 (no py3.14 cuda build yet), so pin 3.13.
python = "3.13.*"
numpy = "*"
scipy = "*"
# CUDA-enabled PyTorch (the cuda build is selected via the __cuda system-requirement above)
pytorch = { version = "*", channel = "conda-forge" }
cuda-version = "13.2.*"  # exact fit to Perlmutter's cudatoolkit 13.2 (cuda130 pytorch build)
# torch.compile(inductor) on GPU codegens a `cuda_utils.c` launcher via Triton, which needs the
# CUDA driver header (cuda.h, from cuda-driver-dev), the runtime headers (cuda-cudart-dev), ptxas
# (cuda-nvcc), and a host C compiler. Without these the eager path works but compiled fails.
cuda-driver-dev = "*"
cuda-cudart-dev = "*"
cuda-nvcc = "*"
c-compiler = "*"

[feature.cheetah-gpu.pypi-dependencies]
cheetah-accelerator = "==0.8.2"

[feature.cheetah-gpu.activation.env]
TORCHINDUCTOR_CACHE_DIR = "$PIXI_PROJECT_ROOT/.builds/cache/torchinductor-gpu"
TORCHINDUCTOR_FX_GRAPH_CACHE = "1"
# point Triton/Inductor at the conda CUDA headers (where cuda.h / cuda_runtime.h live)
CUDA_HOME = "$CONDA_PREFIX/targets/x86_64-linux"

[feature.xsuite-gpu]
platforms = ["linux-64"]

[feature.xsuite-gpu.dependencies]
python = ">=3.11"
numpy = "*"
scipy = "*"
cupy = "*"             # xobjects ContextCupy backend (GPU FFT native; no scipy/pyfftw shim needed)
cuda-version = "13.2.*"  # exact fit to Perlmutter's cudatoolkit 13.2

[feature.xsuite-gpu.pypi-dependencies]
xsuite = "==0.53.4"

# scibmad GPU reuses the scibmad (Julia) feature; only the build task + project differ.
[feature.scibmad-gpu]
platforms = ["linux-64"]

[feature.scibmad-gpu.dependencies]
julia = ">=1.11"

[feature.scibmad-gpu.activation.env]
JULIA_SSL_CA_ROOTS_PATH = ""

[feature.scibmad-gpu.tasks]
build-scibmad-gpu = { cmd = "julia --project=codes/scibmad-gpu codes/scibmad-gpu/build.jl", description = "Instantiate the SciBmad GPU Julia project (+ CUDA.jl)" }

# --------------------------------------------------------------------------- #
# HELIX (linac_gen): PyTorch PIC space charge -- torch.fft integrated Green function (IGF), the same
# model as ImpactX. Space-charge scenario only; CPU + GPU, FP32 + FP64 (dtype/device are runtime).
# Source-only (not on PyPI) -> installed via build-helix (HELIX_SRC hint, else git-clone fallback).
# --------------------------------------------------------------------------- #
[feature.helix]
platforms = ["linux-64"]

[feature.helix.dependencies]
python = "3.13.*"      # match the cuda pytorch build's python (helix-gpu); keep CPU/GPU envs aligned
numpy = "*"
scipy = "*"
h5py = "*"             # linac_gen runtime deps (provided by conda so build.sh can pip --no-deps)
cma = "*"
pytorch = { version = "*", channel = "conda-forge" }   # CPU build (no __cuda system-requirement)
pip = "*"
git = "*"

[feature.helix.tasks]
build-helix = { cmd = "bash codes/helix/build.sh", description = "Install HELIX (linac_gen) into the CPU env" }

[feature.helix-gpu]
platforms = ["linux-64"]

# "13" -> needs a CUDA >=13 driver so the solver picks the cuda13* pytorch build (host driver 610
# and Perlmutter's 13.2 driver both satisfy it). Mirrors feature.cheetah-gpu.
[feature.helix-gpu.system-requirements]
cuda = "13"

[feature.helix-gpu.dependencies]
python = "3.13.*"      # conda-forge ships cuda pytorch for py3.12/3.13 (no py3.14 cuda build yet)
numpy = "*"
scipy = "*"
h5py = "*"
cma = "*"
pytorch = { version = "*", channel = "conda-forge" }   # cuda13* build selected via __cuda above
cuda-version = "13.2.*"  # exact fit to Perlmutter's cudatoolkit 13.2 (cuda130 pytorch build)
pip = "*"
git = "*"

[feature.helix-gpu.tasks]
build-helix-gpu = { cmd = "bash codes/helix/build.sh", description = "Install HELIX (linac_gen) into the GPU env" }

# --------------------------------------------------------------------------- #
# Bmad (Fortran; native source build of bmad-ecosystem; driven by a small Fortran
# driver linked to libbmad -- NO Tao/pytao). Deps mirror bmad-ecosystem's
# .github/bmad-build-env.yaml (minus MPI/python). OpenMP + production -O2.
# --------------------------------------------------------------------------- #
[feature.bmad]
platforms = ["linux-64"]

[feature.bmad.dependencies]
compilers = "*"        # gfortran + gcc/g++
cmake = "*"
make = "*"
autoconf = "*"
automake = "*"
libtool = "*"
m4 = "*"
pkg-config = "*"
gnuconfig = "*"
git = "*"
fftw = "*"
gsl = "*"
fgsl = "*"
hdf5 = "*"
lapack95 = "*"
openblas = "*"
libblas = { version = "*", build = "*openblas" }
libcblas = "*"
liblapack = "*"
ncurses = "*"
readline = "*"
pgplot = "*"           # sim_utils quick_plot links a plot lib (ACC_PLOT_PACKAGE=pgplot)
cairo = "*"
pango = "*"
xraylib = "*"
xorg-libx11 = "*"
xorg-libxt = "*"
xorg-xproto = "*"

[feature.bmad.activation.env]
# native production flags; ACC_* build knobs are written to util/user_prefs by build.sh
FFLAGS = "-O2 -march=native -mtune=native"
FCFLAGS = "-O2 -march=native -mtune=native"

[feature.bmad.tasks]
build-bmad = { cmd = "BENCH_FASTMATH=0 bash codes/bmad/build.sh", description = "Source-build Bmad IEEE + driver" }
build-bmad-fm = { cmd = "BENCH_FASTMATH=1 bash codes/bmad/build.sh", description = "Source-build Bmad fast-math (into bmad-fm)" }

# --------------------------------------------------------------------------- #
# Elegant (source build: GNU Make; SDDS toolkit sibling; MPI Pelegant; partial CUDA; DP only).
# The Makefiles link auto-discovered libs (gsl, fftw, ...) by ABSOLUTE PATH found via LIB_DIRS, so
# pointing LIB_DIRS at $CONDA_PREFIX/lib is enough for those; only LAPACK links with -l (handled in
# build.sh). No fast-math axis (released DP code); GPU shares the `cuda` feature (see envs below).
# --------------------------------------------------------------------------- #
[feature.elegant.dependencies]
python = ">=3.11"          # driver.py + the `sdds` SDDS reader
pip = "*"
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"     # SDDS has Fortran (fftpack) bits
make = "*"
git = "*"
mpich = "*"                # mpicc/mpicxx for Pelegant + mpirun at runtime
gsl = "*"                  # libgsl/libgslcblas (+ headers) -- elegant's bunched_beam.c uses GSL
liblapack = "*"            # liblapack.so
libblas = "*"              # libblas.so
liblapacke = "*"           # lapacke.h (LAPACK_INCLUDE)
fftw = "*"                 # optional libfftw3 (elegant FFT paths)
zlib = "*"
liblzma-devel = "*"        # lzma.h -- SDDS.h includes <lzma.h> unconditionally (+ liblzma.so)
sdds = "*"                 # conda-forge pure-Python SDDS reader (observable extraction)
numpy = "*"

[feature.elegant.tasks]
build-elegant = { cmd = "ELEGANT_DEVICE=cpu bash codes/elegant/build.sh", description = "Source-build Elegant + Pelegant (CPU)" }
build-elegant-gpu = { cmd = "ELEGANT_DEVICE=cuda bash codes/elegant/build.sh", description = "Source-build Elegant + gpu-elegant/gpu-Pelegant (CUDA)" }

# --------------------------------------------------------------------------- #
# Synergia3 (devel3) -- source build: CMake + vendored Kokkos (OpenMP backend) + MPI (MPICH) +
# FFTW/HDF5. libFF EXACT non-paraxial tracking maps (Yoshida-6 thick quad + exact drift) and
# open-boundary Hockney PIC space charge (3D `Space_charge_3d_open_hockney`, integrated "linear"
# Green function = the ImpactX-IGF analog; 2.5D `Space_charge_2d_open_hockney`). DOUBLE precision
# ONLY (bunch is Kokkos::View<double**>); no fast-math build knob (its CMake fast-math append is a
# no-op bug -> IEEE Release). Deps mirror synergia2's own pixi.toml [feature.cpu] (python 3.12 /
# numpy 1.26 / pybind11 2.12 / gsl / MPI-enabled fftw+hdf5+h5py), pinned so the built pybind
# extension is ABI-matched to this env's python. GPU env swaps in the shared `cuda` feature and the
# Kokkos CUDA backend (SYNERGIA_DEVICE=cuda; see codes/synergia/build.sh).
# --------------------------------------------------------------------------- #
[feature.synergia]
platforms = ["linux-64"]

[feature.synergia.dependencies]
python = "3.12.*"                    # match synergia2's pin; the pybind ext is built against this python
pip = "*"
# Match synergia2's OWN compiler pin (cxx-compiler >=1.7.0,<1.8 -> GCC ~13). The unpinned "*" pulls
# GCC 15, whose stricter -Wtemplate-body two-phase-lookup is a HARD ERROR on synergia devel3's own
# template code (src/synergia/bunch/bunch_particles.h: 'comm'/'decompose_1d_local'), breaking the
# build. GCC 13 (synergia's tested compiler) accepts it. Keep c/cxx pinned together.
c-compiler = ">=1.7.0,<1.8"
cxx-compiler = ">=1.7.0,<1.8"
cmake = ">=3.29.5,<3.30"             # match synergia2's OWN pin: CMake 4.x drops pre-3.5 compat and
                                     # breaks synergia's vendored/FetchContent subprojects (Kokkos/Eigen/openPMD)
make = "*"                           # synergia's `cmake --build` uses the default (Unix Makefiles) generator
gsl = ">=2.7,<3"
pybind11 = ">=2.12.0,<2.13"
numpy = ">=1.26.4,<1.27"
scipy = "*"                          # pulled in by seaborn anyway; harmless to pin explicitly
seaborn = ">=0.13.2,<0.14"           # synergia imports it at package import time
mpich = "*"                          # MPI backend (mpirun + mpicc/mpicxx); forces the mpi* builds below to MPICH
mpi4py = "*"                         # synergia imports mpi4py on `import synergia`
libfabric-devel = "*"                # MPICH -lfabric link (as in pyorbit/impactx)
fftw = { version = ">=3.3.10,<3.4", build = "mpi*" }
hdf5 = { version = ">=1.14.3,<1.15", build = "mpi*" }
h5py = { version = ">=3.11.0,<3.12", build = "mpi*" }
git = "*"                            # source-clone fallback + version stamp

[feature.synergia.activation.env]
CXXFLAGS = "-march=native -mtune=native"
CFLAGS = "-march=native -mtune=native"

[feature.synergia.tasks]
# IEEE only (no working fast-math build knob; see registry._supports_fastmath). CPU = Kokkos OpenMP;
# the -cuda task (run in the synergia-cuda env) switches to the Kokkos CUDA backend + cuFFT.
build-synergia = { cmd = "BENCH_FASTMATH=0 bash codes/synergia/build.sh", description = "Source-build Synergia3 (Kokkos OpenMP + MPI, DP)" }
build-synergia-cuda = { cmd = "SYNERGIA_DEVICE=cuda bash codes/synergia/build.sh", description = "Source-build Synergia3 (Kokkos CUDA backend + cuFFT, DP)" }
# IMPACT-Z (source build: CMake + gfortran + MPI; bundled FFTPACK, no external FFTW).
# LBNL Fortran/MPI PIC space-charge code, ImpactX's direct predecessor. DP-only, MPI-only
# (2D domain decomposition; no OpenMP), CPU-only (no GPU path) -> no SP/fast-math/GPU envs.
# A thin driver.py runs the compiled ImpactZexe-mpi and reads observables from the fort.* files.
# >>> IMPACT-Z ADDITIVE BLOCK (merge-friendly; independent of other codes) >>>
# --------------------------------------------------------------------------- #
[feature.impactz.dependencies]
python = ">=3.11"          # driver.py + read_fort.py (stdlib-only parsing)
compilers = "*"            # gfortran (the Fortran build compiler)
cmake = "*"
ninja = "*"
make = "*"
git = "*"
mpich = "*"                # MPI Fortran (find_package(MPI)) + mpirun at runtime
numpy = "*"

[feature.impactz.tasks]
build-impactz = { cmd = "bash codes/impactz/build.sh", description = "Source-build IMPACT-Z (CMake + MPI, bundled FFTPACK)" }
# <<< END IMPACT-Z ADDITIVE BLOCK <<<

# --------------------------------------------------------------------------- #
# Environments: each code is isolated (no driver deps leak in).
# --------------------------------------------------------------------------- #
[environments]
default = { features = [], solve-group = "default" }
# Base (IEEE) envs. impactx here is the DP-CPU IEEE build = the verification baseline.
impactx = { features = ["impactx"], no-default-feature = true }
cheetah = { features = ["cheetah"], no-default-feature = true }
pyat = { features = ["pyat"], no-default-feature = true }
pyorbit = { features = ["pyorbit"], no-default-feature = true }
xsuite = { features = ["xsuite"], no-default-feature = true }
scibmad = { features = ["scibmad"], no-default-feature = true }
bmad = { features = ["bmad"], no-default-feature = true }
# single-precision ImpactX lives in its own env (separate SP-compiled build of the same source)
impactx-sp = { features = ["impactx"], no-default-feature = true }
# Fast-math (overlay) build envs for the compile-time codes -- second build of the same feature,
# compiled with BENCH_FASTMATH=1 into its own tree (see codes/*/build.sh).
impactx-fm = { features = ["impactx"], no-default-feature = true }
impactx-sp-fm = { features = ["impactx"], no-default-feature = true }
pyat-fm = { features = ["pyat"], no-default-feature = true }
pyorbit-fm = { features = ["pyorbit"], no-default-feature = true }
bmad-fm = { features = ["bmad"], no-default-feature = true }
# GPU (CUDA) envs: ImpactX needs a separate CUDA build per precision AND fast-math (impactx + cuda
# features); the pip/Julia codes get one GPU env each (precision + fast-math are runtime switches).
impactx-cuda-dp = { features = ["impactx", "cuda"], no-default-feature = true }
impactx-cuda-sp = { features = ["impactx", "cuda"], no-default-feature = true }
impactx-cuda-dp-fm = { features = ["impactx", "cuda"], no-default-feature = true }
impactx-cuda-sp-fm = { features = ["impactx", "cuda"], no-default-feature = true }
cheetah-gpu = { features = ["cheetah-gpu"], no-default-feature = true }
xsuite-gpu = { features = ["xsuite-gpu"], no-default-feature = true }
# Elegant: DP-only, no fast-math axis. CPU env + a GPU env that adds the shared `cuda` feature
# (nvcc) for the gpu-elegant/gpu-Pelegant build (default arch sm_86 = local A2000 / A100 sm_80).
elegant = { features = ["elegant"], no-default-feature = true }
elegant-gpu = { features = ["elegant", "cuda"], no-default-feature = true }
scibmad-gpu = { features = ["scibmad-gpu"], no-default-feature = true }
# HELIX (linac_gen): PyTorch PIC space charge; CPU env + CUDA env (own cuda13* pytorch build).
helix = { features = ["helix"], no-default-feature = true }
helix-gpu = { features = ["helix-gpu"], no-default-feature = true }
# Synergia3: CPU (Kokkos OpenMP) + CUDA (shared `cuda` feature -> Kokkos CUDA backend). DP-only,
# no fast-math axis. The build.sh keys the Kokkos backend on SYNERGIA_DEVICE.
synergia = { features = ["synergia"], no-default-feature = true }
synergia-cuda = { features = ["synergia", "cuda"], no-default-feature = true }
# IMPACT-Z: DP-only, MPI-only, CPU-only -> a single CPU env (no SP/fast-math/GPU variants).
impactz = { features = ["impactz"], no-default-feature = true }
